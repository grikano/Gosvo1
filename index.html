<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Государство</title>
<style>body{margin:0;background:#14171c;color:#98a2b3;font:16px system-ui,sans-serif;padding:24px}</style></head>
<body>Загрузка…<script>
fetch("game.txt?v=" + Date.now()).then(r => { if (!r.ok) throw new Error("game.txt: " + r.status); return r.text(); })
  .then(t => { document.open(); document.write(t); document.close(); })
  .catch(e => { document.body.textContent = "Не удалось загрузить игру: " + e.message; });
</script></body></html>
